<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Normative DWI — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Input maps</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <label class="nd-file" id="dropZone">
            <input id="imageInput" type="file" data-neurodesk-input="image" data-appends multiple aria-label="Choose DTI or NODDI maps" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop FA, MD, ICVF, ISOVF or OD maps (NIfTI)</span>
          </label>
          <p class="nd-hint">Maps must be in UK Biobank 2 mm space and harmonised to UK Biobank.</p>
          <div id="mapList"></div>
        </div>
      </details>

      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Subject</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="age">Age <small>years</small>
              <span class="nd-info-icon" tabindex="0" aria-label="About age">i<span class="nd-info-tooltip">The models were trained on ages of about 45 to 81. Ages outside a voxel's training range are scored at its nearest end, and the status line says so.</span></span>
            </label>
            <input id="age" type="number" min="0" max="120" step="0.1" required />
          </div>
          <div class="nd-field">
            <label for="sex">Sex</label>
            <select id="sex">
              <option value="">Choose…</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
            </select>
          </div>
          <details class="nd-sidebar-section" id="advancedSettings">
            <summary class="nd-section-title">Advanced settings</summary>
            <div class="nd-section-content">
              <div class="nd-field">
                <label for="compute">Compute
                  <span class="nd-info-icon" tabindex="0" aria-label="About compute">i<span class="nd-info-tooltip">CPU computes in double precision and is the reference. GPU uses WebGPU in single precision; tested to agree with the CPU within 1e-3 of z.</span></span>
                </label>
                <select id="compute">
                  <option value="cpu">CPU (reference)</option>
                  <option value="gpu">GPU when available</option>
                </select>
              </div>
              <div class="nd-field">
                <label for="storeUrl">Model store URL
                  <span class="nd-info-icon" tabindex="0" aria-label="About the model store">i<span class="nd-info-tooltip">An nmzarr store (format 0.1) served with HTTP range requests and CORS, or choose a local copy of the store folder below.</span></span>
                </label>
                <input id="storeUrl" type="url" placeholder="https://…/ukb_blr_agesex.zarr" />
              </div>
              <label class="nd-file" id="storeDropZone">
                <input id="storeFolder" type="file" data-neurodesk-input="model" webkitdirectory multiple aria-label="Choose a local model store folder" />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <span>Choose a local model store folder</span>
              </label>
              <p id="storeInfo" class="nd-file-info" hidden></p>
              <button id="clearCacheButton" class="nd-btn nd-btn-secondary" type="button">Clear cached models</button>
            </div>
          </details>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Compute z-maps</button>
        </div>
      </details>

      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="resultList"></div>
        </div>
      </details>

      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="gl1" aria-label="Z-map viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop DTI or NODDI maps anywhere, or choose an example.</p>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Processing progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel processing" aria-label="Cancel processing" hidden>×</button>
    </footer>

    <template id="aboutContent">
      <p>Normative DWI scores one person's diffusion microstructure against voxelwise normative models of the UK Biobank population. For every voxel it reports a z-score: how far the person's value lies from what the model expects for their age and sex.</p>
      <p><strong>Models.</strong> Bayesian linear regression with a sinh-arcsinh likelihood warp and age-dependent noise (PCNtoolkit 1.4.0 (fork gdevenyi/PCNToolkit@4219457, not released)), fitted per voxel on ComBat-harmonised UK Biobank data. The covariate is age (cubic B-spline); sex is a batch effect. Markers: FA and MD (DTI), ICVF, ISOVF and OD (NODDI), on the UK Biobank 2 mm template grid (97×115×97).</p>
      <p><strong>Inputs.</strong> Maps must already be registered to that grid, resampled with a B-spline, ANLM-denoised and masked as in the models' training data, and harmonised to UK Biobank. The app checks the grid and refuses other images; it cannot check harmonisation. Unharmonised data will show site effects as deviations.</p>
      <p><strong>Ages.</strong> The models were trained on ages of about 45 to 81. Ages outside a voxel's training range are scored at its nearest end, and the status line says so.</p>
      <p><strong>Output.</strong> One z-map per input map, on the input's grid, marked as a z-score image (NIfTI intent 5). Voxels without a model, or where the input is 0 or not a number, are written as 0; the viewer leaves them transparent and its readout says "not scored".</p>
      <p><strong>Accuracy.</strong> The CPU path reproduces PCNtoolkit's z-scores to better than 1e-6, with ages clamped to the training range as the models' reference pipeline does (PCNtoolkit itself would extrapolate). The GPU path computes in single precision and is tested to agree with the CPU within 1e-3 (relative to |z|, or absolute below 1); the largest difference measured on a real subject was 9e-5, with a software GPU (SwiftShader). If the GPU fails, scoring continues on the CPU.</p>
    </template>
    <template id="privacyContent">
      <p>Your maps are processed locally in this browser and are never uploaded. The only network traffic is downloading the model store (and the example, if you choose one). A store at a pinned, immutable address is cached in this browser for later visits; Advanced settings has a button to clear that cache.</p>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
